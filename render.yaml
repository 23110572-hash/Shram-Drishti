# Render blueprint for the API. The frontend is deployed separately on Vercel.
#
# Expensive document work is consumed one job at a time from Postgres. Uploaded
# bytes and rendered evidence images are mirrored to Neon because the free Render
# filesystem is only a cache and disappears on restarts/deployments.

services:
  - type: web
    name: shram-drishti-api
    runtime: python
    plan: free
    region: singapore
    rootDir: backend

    buildCommand: pip install --upgrade pip && pip install -r requirements.txt

    # Create newly added tables idempotently before serving, then run one API
    # process. Pipeline concurrency is controlled by the database-backed worker,
    # not by spawning request background threads.
    startCommand: python -m app.cli init-db && uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 1

    healthCheckPath: /healthz

    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"

      - key: ENVIRONMENT
        value: production

      - key: LOG_FORMAT
        value: json

      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OCR_SPACE_API_KEY
        sync: false

      - key: CORS_ALLOWED_ORIGINS
        sync: false

      - key: LLM_MODEL
        value: google/gemini-2.5-flash-lite

      - key: LLM_BUDGET_PER_DOC_USD
        value: "0.50"

      - key: ALLOW_CLOUD_OCR_IN_PRODUCTION
        value: "true"
