pack: industrial_relations
version: '2026.2'
jurisdiction: IN
description: 'Industrial Relations Code, 2020 (Act 35 of 2020). Thresholds were read from the IndiaCode consolidated text
  (as on 2 April 2026) held at "storage/Industrial relations code 2020.md", and each is quoted in the rule''s source_ref.

  Every rule in this pack carries basis: STATUTE. The IR Code is unusual among the four in stating its own numbers — one hundred
  workers for a Works Committee, twenty for a Grievance Redressal Committee, ten members, three hundred for standing orders,
  thirty days for a decision — so nothing here waits on a notification.

  '
rules:
- id: IR.GRIEVANCE_COMMITTEE.SIZE_CAP
  code: INDUSTRIAL_RELATIONS
  kind: NON_COMPLIANCE
  severity: LOW
  weight: 2
  title: Grievance Redressal Committee has more than ten members
  citation: Industrial Relations Code, 2020 — s.4(4)
  source_ref: 'IR Code s.4(4): ''The total number of members of the Grievance Redressal Committee shall not exceed ten'''
  basis: STATUTE
  requires:
  - prose
  applicability: estab.worker_count >= 20
  expression: 'is_missing(prose.grievance_committee_members) or prose.grievance_committee_members <= 10

    '
  observe:
    members: prose.grievance_committee_members
  expect:
    maximum_members: '10'
  message:
    en: The Grievance Redressal Committee has more than ten members.
    hi: शिकायत निवारण समिति में दस से अधिक सदस्य हैं।
  remediation:
    en: Reconstitute the committee with no more than ten members in total.
    hi: समिति का पुनर्गठन कुल दस से अधिक सदस्यों के बिना करें।
  fixtures:
  - name: eight_members
    should_pass: true
    facts:
      estab:
        worker_count: 40
      prose:
        grievance_committee_members: 8
  - name: fourteen_members
    should_pass: false
    facts:
      estab:
        worker_count: 40
      prose:
        grievance_committee_members: 14
- id: IR.GRIEVANCE_COMMITTEE.WOMEN_REPRESENTATION
  code: INDUSTRIAL_RELATIONS
  kind: NON_COMPLIANCE
  severity: MEDIUM
  weight: 5
  title: Women's representation on the Grievance Committee below the workforce proportion
  citation: Industrial Relations Code, 2020 — s.4(4) proviso
  source_ref: 'IR Code s.4(4) proviso: representation of women workers ''shall not be less than the proportion of women workers
    to the total workers employed'''
  basis: STATUTE
  requires:
  - estab
  - prose
  applicability: estab.worker_count >= 20 and estab.women_worker_count > 0
  expression: 'is_missing(prose.grievance_committee_members) or is_missing(prose.grievance_committee_women) or ratio(prose.grievance_committee_women,
    prose.grievance_committee_members) >= ratio(estab.women_worker_count, estab.worker_count)

    '
  observe:
    committee_women_share: ratio(prose.grievance_committee_women, prose.grievance_committee_members)
    workforce_women_share: ratio(estab.women_worker_count, estab.worker_count)
  expect:
    minimum_share: ratio(estab.women_worker_count, estab.worker_count)
  message:
    en: Women's representation on the Grievance Redressal Committee is below their proportion in the workforce.
    hi: शिकायत निवारण समिति में महिलाओं का प्रतिनिधित्व कार्यबल में उनके अनुपात से कम है।
  remediation:
    en: Add women members so their share on the committee is at least their share of the workforce.
    hi: महिला सदस्य जोड़ें ताकि समिति में उनका अनुपात कार्यबल में उनके अनुपात से कम न हो।
  fixtures:
  - name: proportionate_representation
    should_pass: true
    facts:
      estab:
        worker_count: 100
        women_worker_count: 30
      prose:
        grievance_committee_members: 10
        grievance_committee_women: 3
  - name: under_represented
    should_pass: false
    facts:
      estab:
        worker_count: 100
        women_worker_count: 40
      prose:
        grievance_committee_members: 10
        grievance_committee_women: 1
- id: IR.STRIKE.NOTICE_PERIOD
  code: INDUSTRIAL_RELATIONS
  kind: NON_COMPLIANCE
  severity: MEDIUM
  weight: 4
  title: Strike or lock-out without the required fourteen days' notice
  citation: Industrial Relations Code, 2020 — s.62
  source_ref: 'IR Code s.62: no strike ''without giving notice of strike ... within sixty days before striking'' or ''within
    fourteen days of giving such notice'''
  basis: STATUTE
  requires:
  - prose
  expression: 'is_missing(prose.strike_notice_days) or prose.strike_notice_days >= 14

    '
  observe:
    notice_days_given: prose.strike_notice_days
  expect:
    minimum_notice_days: '14'
  message:
    en: A strike or lock-out proceeded without the required fourteen days' notice.
    hi: आवश्यक चौदह दिनों की सूचना के बिना हड़ताल या तालाबंदी की गई।
  remediation:
    en: Ensure notice of strike or lock-out is given and that fourteen days elapse before action is taken.
    hi: सुनिश्चित करें कि हड़ताल या तालाबंदी की सूचना दी जाए और कार्रवाई से पूर्व चौदह दिन व्यतीत हों।
  fixtures:
  - name: proper_notice
    should_pass: true
    facts:
      prose:
        strike_notice_days: 21
  - name: short_notice
    should_pass: false
    facts:
      prose:
        strike_notice_days: 5
- id: IR.GRIEVANCE_COMMITTEE.EQUAL_REPRESENTATION
  code: INDUSTRIAL_RELATIONS
  kind: NON_COMPLIANCE
  severity: HIGH
  weight: 6
  title: Uploaded Grievance Committee record has unequal employer and worker representation
  citation: Industrial Relations Code, 2020 — s.4(2)
  source_ref: 'storage/Industrial relations code 2020.md, s.4(2): the committee shall consist of equal numbers representing
    the employer and workers'
  basis: STATUTE
  requires:
  - docs
  - prose
  applicability: docs.grievance_committee_count > 0
  expression: not is_missing(prose.grievance_committee_employer_reps) and not is_missing(prose.grievance_committee_worker_reps)
    and prose.grievance_committee_employer_reps == prose.grievance_committee_worker_reps
  observe:
    employer_representatives: prose.grievance_committee_employer_reps
    worker_representatives: prose.grievance_committee_worker_reps
  expect:
    equal_representation: 'True'
  message:
    en: The uploaded committee record does not show equal employer and worker representation.
    hi: null
  remediation:
    en: Reconstitute and record the committee with equal employer and worker representation.
    hi: null
  fixtures:
  - name: equal
    should_pass: true
    facts:
      docs:
        grievance_committee_count: 1
      prose:
        grievance_committee_employer_reps: 4
        grievance_committee_worker_reps: 4
  - name: unequal
    should_pass: false
    facts:
      docs:
        grievance_committee_count: 1
      prose:
        grievance_committee_employer_reps: 6
        grievance_committee_worker_reps: 2
  - name: not_uploaded
    should_pass: true
    facts:
      docs:
        grievance_committee_count: 0
      prose: {}
- id: IR.GRIEVANCE_COMMITTEE.CHAIRPERSON_RECORDED
  code: INDUSTRIAL_RELATIONS
  kind: NON_COMPLIANCE
  severity: MEDIUM
  weight: 4
  title: Chairperson is not identified in the uploaded Grievance Committee record
  citation: Industrial Relations Code, 2020 — s.4(3)
  source_ref: 'storage/Industrial relations code 2020.md, s.4(3): the chairperson is selected alternately from employer and
    worker representatives'
  basis: STATUTE
  requires:
  - docs
  - prose
  applicability: docs.grievance_committee_count > 0
  expression: prose.has_chairperson == True
  observe:
    recorded_value: prose.has_chairperson
  expect:
    required: 'True'
  message:
    en: The uploaded committee record does not identify its chairperson.
    hi: null
  remediation:
    en: Record the chairperson selected in accordance with the alternating representation requirement.
    hi: null
  fixtures:
  - name: uploaded_record_complies
    should_pass: true
    facts:
      docs:
        grievance_committee_count: 1
      prose:
        has_chairperson: true
  - name: uploaded_record_is_incomplete
    should_pass: false
    facts:
      docs:
        grievance_committee_count: 1
      prose:
        has_chairperson: false
  - name: document_not_uploaded_is_not_assessed
    should_pass: true
    facts:
      docs:
        grievance_committee_count: 0
      prose:
        has_chairperson: false
- id: IR.STRIKE.NOTICE_WITHIN_SIXTY_DAYS
  code: INDUSTRIAL_RELATIONS
  kind: NON_COMPLIANCE
  severity: MEDIUM
  weight: 4
  title: Strike or lock-out notice falls outside the sixty-day window
  citation: Industrial Relations Code, 2020 — s.62
  source_ref: 'storage/Industrial relations code 2020.md, s.62: notice is given within sixty days before the strike or lock-out'
  basis: STATUTE
  requires:
  - prose
  expression: is_missing(prose.strike_notice_days) or prose.strike_notice_days <= 60
  observe:
    notice_days: prose.strike_notice_days
  expect:
    maximum_notice_days: '60'
  message:
    en: The uploaded record places the strike or lock-out outside the permitted sixty-day notice window.
    hi: null
  remediation:
    en: Issue a fresh notice and ensure the action occurs no earlier than fourteen and no later than sixty days after notice.
    hi: null
  fixtures:
  - name: within_window
    should_pass: true
    facts:
      prose:
        strike_notice_days: 30
  - name: outside_window
    should_pass: false
    facts:
      prose:
        strike_notice_days: 75
- id: IR.STANDING_ORDERS.CERTIFIED_OR_MODEL
  code: INDUSTRIAL_RELATIONS
  kind: NON_COMPLIANCE
  severity: HIGH
  weight: 6
  title: Uploaded standing orders are neither certified nor recorded as adopted model orders
  citation: Industrial Relations Code, 2020 — Chapter IV
  source_ref: 'storage/Industrial relations code 2020.md, Chapter IV: model standing orders and certification of standing
    orders'
  basis: STATUTE
  requires:
  - docs
  - prose
  applicability: docs.standing_orders_count > 0
  expression: prose.is_certified == True or prose.adopts_model_standing_orders == True
  observe:
    certified: prose.is_certified
    model_orders_adopted: prose.adopts_model_standing_orders
  expect:
    valid_basis: 'True'
  message:
    en: The uploaded standing orders do not show certification or adoption of the applicable model standing orders.
    hi: null
  remediation:
    en: Record adoption of the applicable model orders or obtain certification of differing standing orders.
    hi: null
  fixtures:
  - name: certified
    should_pass: true
    facts:
      docs:
        standing_orders_count: 1
      prose:
        is_certified: true
        adopts_model_standing_orders: false
  - name: model_adopted
    should_pass: true
    facts:
      docs:
        standing_orders_count: 1
      prose:
        is_certified: false
        adopts_model_standing_orders: true
  - name: neither
    should_pass: false
    facts:
      docs:
        standing_orders_count: 1
      prose:
        is_certified: false
        adopts_model_standing_orders: false
- id: IR.STANDING_ORDERS.WORKER_CLASSIFICATION
  code: INDUSTRIAL_RELATIONS
  kind: NON_COMPLIANCE
  severity: MEDIUM
  weight: 4
  title: Uploaded standing orders omit worker classification
  citation: Industrial Relations Code, 2020 — First Schedule
  source_ref: 'storage/Industrial relations code 2020.md, First Schedule: classification of workers is a matter to be provided
    in standing orders'
  basis: STATUTE
  requires:
  - docs
  - prose
  applicability: docs.standing_orders_count > 0
  expression: prose.covers_classification_of_workers == True
  observe:
    recorded_value: prose.covers_classification_of_workers
  expect:
    required: 'True'
  message:
    en: The uploaded standing orders do not cover classification of workers.
    hi: null
  remediation:
    en: Add the required worker classifications to the standing orders.
    hi: null
  fixtures:
  - name: uploaded_record_complies
    should_pass: true
    facts:
      docs:
        standing_orders_count: 1
      prose:
        covers_classification_of_workers: true
  - name: uploaded_record_is_incomplete
    should_pass: false
    facts:
      docs:
        standing_orders_count: 1
      prose:
        covers_classification_of_workers: false
  - name: document_not_uploaded_is_not_assessed
    should_pass: true
    facts:
      docs:
        standing_orders_count: 0
      prose:
        covers_classification_of_workers: false
- id: IR.STANDING_ORDERS.DISCIPLINARY_PROCEDURE
  code: INDUSTRIAL_RELATIONS
  kind: NON_COMPLIANCE
  severity: MEDIUM
  weight: 4
  title: Uploaded standing orders omit disciplinary procedure
  citation: Industrial Relations Code, 2020 — First Schedule
  source_ref: 'storage/Industrial relations code 2020.md, First Schedule: misconduct and means of redress are matters for
    standing orders'
  basis: STATUTE
  requires:
  - docs
  - prose
  applicability: docs.standing_orders_count > 0
  expression: prose.covers_disciplinary_procedure == True
  observe:
    recorded_value: prose.covers_disciplinary_procedure
  expect:
    required: 'True'
  message:
    en: The uploaded standing orders do not describe the disciplinary procedure.
    hi: null
  remediation:
    en: Add misconduct, disciplinary-process and worker-redress provisions.
    hi: null
  fixtures:
  - name: uploaded_record_complies
    should_pass: true
    facts:
      docs:
        standing_orders_count: 1
      prose:
        covers_disciplinary_procedure: true
  - name: uploaded_record_is_incomplete
    should_pass: false
    facts:
      docs:
        standing_orders_count: 1
      prose:
        covers_disciplinary_procedure: false
  - name: document_not_uploaded_is_not_assessed
    should_pass: true
    facts:
      docs:
        standing_orders_count: 0
      prose:
        covers_disciplinary_procedure: false
- id: IR.STANDING_ORDERS.TERMINATION_TERMS
  code: INDUSTRIAL_RELATIONS
  kind: NON_COMPLIANCE
  severity: MEDIUM
  weight: 4
  title: Uploaded standing orders omit termination terms
  citation: Industrial Relations Code, 2020 — First Schedule
  source_ref: 'storage/Industrial relations code 2020.md, First Schedule: termination of employment and notice are matters
    for standing orders'
  basis: STATUTE
  requires:
  - docs
  - prose
  applicability: docs.standing_orders_count > 0
  expression: prose.covers_termination == True
  observe:
    recorded_value: prose.covers_termination
  expect:
    required: 'True'
  message:
    en: The uploaded standing orders do not state termination and notice conditions.
    hi: null
  remediation:
    en: Add the applicable termination and notice conditions.
    hi: null
  fixtures:
  - name: uploaded_record_complies
    should_pass: true
