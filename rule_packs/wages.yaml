    hi: null
  remediation:
    en: Complete the gross-wage entry from the verified wage components.
    hi: null
  fixtures:
  - name: compliant_record
    should_pass: true
    facts:
      wage_register:
      - gross_paise: 1500000
  - name: non_compliant_record
    should_pass: false
    facts:
      wage_register:
      - gross_paise: null
- id: WAGES.REGISTER.NET_RECORDED
  code: WAGES
  kind: NON_COMPLIANCE
  severity: MEDIUM
  weight: 4
  title: Net wages are blank in an uploaded wage row
  citation: Code on Wages, 2019 — s.50; Code on Wages (Central) Rules, 2026 — r.51 and Form IV
  source_ref: storage/the code on wages 2019 central rule.md, r.51 and Form IV prescribed wage-register particulars
  basis: STATUTE
  requires:
  - wage_register
  for_each: wage_register
  expression: not is_missing(row.net_paid_paise)
  observe:
    rows_checked: count(wage_register)
  expect:
    requirement_met: 'True'
  message:
    en: Net wages are blank for a worker in the uploaded wage record.
    hi: null
  remediation:
    en: Record the verified net amount paid after additions and deductions.
    hi: null
  fixtures:
  - name: compliant_record
    should_pass: true
    facts:
      wage_register:
      - net_paid_paise: 1300000
  - name: non_compliant_record
    should_pass: false
    facts:
      wage_register:
      - net_paid_paise: null
- id: WAGES.REGISTER.PAYMENT_DATE_RECORDED
  code: WAGES
  kind: NON_COMPLIANCE
  severity: MEDIUM
  weight: 4
  title: Payment date is blank in an uploaded wage row
  citation: Code on Wages, 2019 — s.17 and s.50; Code on Wages (Central) Rules, 2026 — Form IV
  source_ref: storage/the code on wages 2019 central rule.md, Form IV requires the date of payment in the wage record
  basis: STATUTE
  requires:
  - wage_register
  for_each: wage_register
  expression: not is_missing(row.paid_on)
  observe:
