- id: OSH.ACCIDENT.NOTIFICATION_REFERENCE
  code: OSH
  kind: NON_COMPLIANCE
  severity: HIGH
  weight: 5
  title: Accident notification date is recorded without a notification reference
  citation: OSH & Working Conditions Code, 2020 — s.10; OSHWC (Central) Rules, 2026 — r.7
  source_ref: storage/The Occupational Safety, Health and Working Conditions Code, 2020 central code.md, r.7 prescribed accident
    and dangerous-occurrence notification
  basis: STATUTE
  requires:
  - incidents
  for_each: incidents
  expression: is_missing(row.notified_on) or not is_missing(row.notification_reference)
  observe:
    rows_checked: count(incidents)
  expect:
    requirement_met: 'True'
  message:
    en: An uploaded accident row gives a notification date but no notification reference.
    hi: null
  remediation:
    en: Record the authority notification reference against the accident entry.
    hi: null
  fixtures:
  - name: compliant_record
    should_pass: true
    facts:
      incidents:
      - notified_on: '2026-03-05'
        notification_reference: NOTICE-12
  - name: non_compliant_record
    should_pass: false
    facts:
      incidents:
      - notified_on: '2026-03-05'
        notification_reference: null
- id: OSH.HOURS.BEYOND_NORMAL_DAY_NOT_OVERTIME
  code: OSH
  kind: DISCREPANCY
  severity: HIGH
  weight: 7
  title: Work beyond the eight-hour normal day is not recorded as overtime
  citation: OSH & Working Conditions Code, 2020 — s.25; OSHWC (Central) Rules, 2026 — r.69
  source_ref: storage/The Occupational Safety, Health and Working Conditions Code, 2020.md, s.25 fixes the eight-hour normal
    working day; storage/The Occupational Safety, Health and Working Conditions Code, 2020 central code.md, r.69 treats work
    beyond it as overtime
  basis: STATUTE
  requires:
  - attendance
  for_each: attendance
  expression: is_missing(row.max_daily_hours) or row.max_daily_hours <= 8 or default(row.overtime_hours, 0) > 0
  observe:
    highest_daily_hours: maximum(pluck(attendance, 'max_daily_hours'))
    overtime_hours_recorded: total(pluck(attendance, 'overtime_hours'))
  expect:
    normal_day_hours: '8'
  message:
    en: A worker was recorded working more than the eight-hour normal working day on at least one day, but no overtime hours
      are recorded for that worker.
    hi: null
  remediation:
    en: Record every hour worked beyond the eight-hour normal day as overtime and pay it at not less than twice the ordinary
      rate.
    hi: null
  fixtures:
  - name: nine_hour_day_recorded_as_overtime
    should_pass: true
    facts:
      attendance:
      - max_daily_hours: 9
        overtime_hours: 6
  - name: eight_hour_day_needs_no_overtime
    should_pass: true
    facts:
      attendance:
      - max_daily_hours: 8
        overtime_hours: 0
  - name: thirteen_hour_day_without_overtime
    should_pass: false
    facts:
      attendance:
      - max_daily_hours: 13.5
        overtime_hours: 0
