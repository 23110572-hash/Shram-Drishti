pack: osh
version: '2026.3'
jurisdiction: IN
description: 'Occupational Safety, Health and Working Conditions Code, 2020 (Act 37 of 2020). Registration validity, appointment
  letters, contractor licensing, accident notification and the canteen threshold are stated in the Act itself and carry basis:
  STATUTE. Attendance and overtime checks compare the muster roll against the wage register and need no external figure, so
  they carry basis: RECONCILIATION.

  The Code deliberately leaves several numbers to be notified. s.24(3) says only that the Central Government "may make rules"
  for creches, with no headcount at all; s.25 fixes eight hours of normal work but leaves intervals and spreadover to notification,
  so the twelve-hour ceiling tested here comes from the Rules; s.10 leaves the accident notification period to be prescribed.
  Those rules carry basis: RULES_PENDING and must not be enforced until the notified Rules are held.

  '
rules:
- id: OSH.CONTRACTOR.LICENCE_VALID
  code: OSH
  kind: NON_COMPLIANCE
  severity: HIGH
  weight: 8
  title: Contract labour engaged through an unlicensed or lapsed contractor
  citation: OSH & Working Conditions Code, 2020 — ss.45 and 47; OSHWC (Central) Rules, 2026 — rr.87-90
  source_ref: 'storage/The Occupational Safety, Health and Working Conditions Code, 2020 central code.md, rr.87-90: licensing
    applies where fifty or more contract labour are engaged; licence validity is five years'
  basis: STATUTE
  requires:
  - estab
  - contractors
  applicability: estab.engages_contract_labour == True and estab.contract_worker_count >= 50
  expression: 'is_missing(contractors.without_valid_licence) or contractors.without_valid_licence == 0

    '
  observe:
    contractors_engaged: contractors.total
    without_valid_licence: contractors.without_valid_licence
    expired_licences: contractors.expired
  expect:
    without_valid_licence: '0'
  message:
    en: Contract labour is engaged through one or more contractors without a valid licence.
    hi: एक या अधिक ठेकेदारों के माध्यम से वैध अनुज्ञप्ति के बिना ठेका श्रम नियोजित है।
  remediation:
    en: Ensure every contractor holds a current licence covering the number of workers deployed, and stop engaging unlicensed
      contractors.
    hi: सुनिश्चित करें कि प्रत्येक ठेकेदार के पास नियोजित श्रमिकों की संख्या हेतु वर्तमान अनुज्ञप्ति है, और अनुज्ञप्तिहीन
      ठेकेदारों को नियोजित करना बंद करें।
  fixtures:
  - name: all_contractors_licensed
    should_pass: true
    facts:
      estab:
        engages_contract_labour: true
        contract_worker_count: 60
      contractors:
        total: 3
        without_valid_licence: 0
        expired: 0
  - name: one_expired_licence
    should_pass: false
    facts:
      estab:
        engages_contract_labour: true
        contract_worker_count: 60
      contractors:
        total: 3
        without_valid_licence: 1
        expired: 1
- id: OSH.CONTRACTOR.LICENCE_HEADCOUNT
  code: OSH
  kind: NON_COMPLIANCE
  severity: MEDIUM
  weight: 5
  title: More contract workers deployed than the licence permits
  citation: OSHWC (Central) Rules, 2026 — r.89(2)(ii)
  source_ref: 'storage/The Occupational Safety, Health and Working Conditions Code, 2020 central code.md, r.89(2)(ii): contractor
    licence records the maximum number of contract labour'
  basis: RECONCILIATION
  requires:
  - estab
  - contractors
  applicability: estab.engages_contract_labour == True and estab.contract_worker_count >= 50
  expression: 'is_missing(contractors.over_deployed) or contractors.over_deployed == 0

    '
  observe:
    contractors_over_deployed: contractors.over_deployed
  expect:
    over_deployed: '0'
  message:
    en: One or more contractors have deployed more workers than their licence permits.
    hi: एक या अधिक ठेकेदारों ने अपनी अनुज्ञप्ति में अनुमत संख्या से अधिक श्रमिक नियोजित किए हैं।
  remediation:
    en: Apply to amend the licence for the higher headcount, or reduce deployment to the licensed number.
    hi: अधिक संख्या हेतु अनुज्ञप्ति संशोधन के लिए आवेदन करें, अथवा नियोजन को अनुज्ञप्त संख्या तक घटाएँ।
  fixtures:
  - name: within_licence
    should_pass: true
    facts:
      estab:
        engages_contract_labour: true
        contract_worker_count: 60
      contractors:
        over_deployed: 0
  - name: over_deployed
    should_pass: false
    facts:
      estab:
        engages_contract_labour: true
        contract_worker_count: 60
      contractors:
        over_deployed: 2
- id: OSH.ACCIDENT.NOTIFIED
  code: OSH
  kind: DISCREPANCY
  severity: CRITICAL
  weight: 9
  title: Recorded accidents were not notified
  citation: OSH & Working Conditions Code, 2020 — s.10
  source_ref: Act requires notice of accidents causing death or bodily injury to the prescribed authority
  basis: STATUTE
  requires:
  - incidents
  expression: 'is_missing(incidents.total) or incidents.total == 0 or incidents.notified >= incidents.total

    '
  observe:
    incidents_recorded: incidents.total
    incidents_notified: incidents.notified
    unnotified: incidents.total - incidents.notified
  expect:
    notified: incidents.total
  message:
    en: One or more accidents recorded in the accident register were not notified to the prescribed authority.
    hi: दुर्घटना रजिस्टर में दर्ज एक या अधिक दुर्घटनाओं की सूचना निर्धारित प्राधिकारी को नहीं दी गई।
  remediation:
    en: File the outstanding accident notifications immediately and review the notification procedure.
    hi: बकाया दुर्घटना सूचनाएँ तत्काल दाखिल करें और सूचना प्रक्रिया की समीक्षा करें।
  fixtures:
  - name: all_notified
    should_pass: true
    facts:
      incidents:
        total: 2
        notified: 2
  - name: one_unnotified
    should_pass: false
    facts:
      incidents:
        total: 2
        notified: 1
  - name: no_incidents
    should_pass: true
    facts:
      incidents:
        total: 0
        notified: 0
- id: OSH.HOURS.WEEKLY_CAP
  code: OSH
  kind: NON_COMPLIANCE
  severity: MEDIUM
  weight: 5
  title: Weekly working hours exceed the permitted maximum
  citation: OSH & Working Conditions Code, 2020 — s.25; OSHWC (Central) Rules, 2026 — r.64
  source_ref: 'storage/The Occupational Safety, Health and Working Conditions Code, 2020 central code.md, r.64: no worker
    shall be required or allowed to work for more than forty-eight hours in any week'
  basis: STATUTE
  requires:
  - attendance
  for_each: attendance
  expression: 'is_missing(row.max_weekly_hours) or row.max_weekly_hours <= 48

    '
  observe:
    highest_weekly_hours: maximum(pluck(attendance, 'max_weekly_hours'))
  expect:
    maximum_weekly_hours: '48'
  message:
    en: One or more workers exceeded the permitted maximum weekly hours.
    hi: एक या अधिक श्रमिकों ने अनुमत अधिकतम साप्ताहिक घंटों से अधिक कार्य किया।
  remediation:
    en: Keep normal weekly hours within the statutory limit and treat additional hours as overtime.
    hi: सामान्य साप्ताहिक घंटे सांविधिक सीमा के भीतर रखें और अतिरिक्त घंटों को अतिरिक्त समय मानें।
  fixtures:
  - name: within_weekly_limit
    should_pass: true
    facts:
      attendance:
      - max_weekly_hours: 46
  - name: seventy_hour_week
    should_pass: false
    facts:
      attendance:
      - max_weekly_hours: 70
- id: OSH.ATTENDANCE.DAYS_PAID_MATCH
  code: OSH
  kind: DISCREPANCY
  severity: HIGH
  weight: 7
  title: Days paid are fewer than days recorded as present
  citation: OSH & Working Conditions Code, 2020 — s.25 read with the Code on Wages
  source_ref: 'Cross-document reconciliation: muster roll against the wage register'
  basis: RECONCILIATION
  requires:
  - wage_register
  for_each: wage_register
  expression: 'is_missing(row.days_present) or is_missing(row.days_paid) or row.days_paid >= row.days_present

    '
  observe:
    workers_underpaid_days: count(wage_register)
    highest_days_present: maximum(pluck(wage_register, 'days_present'))
    lowest_days_paid: minimum(pluck(wage_register, 'days_paid'))
  expect:
    days_paid_at_least: maximum(pluck(wage_register, 'days_present'))
  message:
    en: One or more workers were paid for fewer days than the attendance record shows them present.
    hi: एक या अधिक श्रमिकों को उपस्थिति अभिलेख में दर्शाए दिनों से कम दिनों का भुगतान किया गया।
  remediation:
    en: Reconcile the muster roll against the wage register and pay for all days worked.
    hi: हाजिरी रजिस्टर और मजदूरी रजिस्टर का मिलान करें और सभी कार्य दिवसों का भुगतान करें।
  fixtures:
  - name: paid_for_all_days
    should_pass: true
    facts:
      wage_register:
      - days_present: 26
        days_paid: 26
  - name: four_days_unpaid
    should_pass: false
    facts:
      wage_register:
      - days_present: 26
        days_paid: 22
- id: OSH.OVERTIME.HOURS_PAID
  code: OSH
  kind: DISCREPANCY
  severity: HIGH
  weight: 8
  title: Overtime hours recorded but no overtime paid
  citation: OSH & Working Conditions Code, 2020 — s.25 read with Code on Wages s.14
  source_ref: 'Cross-document reconciliation: attendance overtime hours against wage register overtime payment'
  basis: RECONCILIATION
  requires:
  - wage_register
  for_each: wage_register
  expression: 'is_missing(row.overtime_hours) or row.overtime_hours == 0 or default(row.overtime_paise, 0) > 0

    '
  observe:
    workers_with_unpaid_overtime: count(wage_register)
    total_overtime_hours: total(pluck(wage_register, 'overtime_hours'))
    total_overtime_paid_paise: total(pluck(wage_register, 'overtime_paise'))
  expect:
    minimum_overtime_paise: '1'
  message:
    en: Overtime hours are recorded in the attendance register but no overtime payment appears in the wage register.
    hi: हाजिरी रजिस्टर में अतिरिक्त समय दर्ज है परन्तु मजदूरी रजिस्टर में अतिरिक्त समय का भुगतान नहीं दिखता।
  remediation:
    en: Pay overtime at not less than twice the ordinary rate for all recorded overtime hours.
    hi: दर्ज सभी अतिरिक्त समय घंटों के लिए सामान्य दर से कम से कम दोगुनी दर पर भुगतान करें।
  fixtures:
  - name: overtime_paid
    should_pass: true
    facts:
      wage_register:
      - overtime_hours: 12
        overtime_paise: 156000
  - name: overtime_unpaid
    should_pass: false
    facts:
      wage_register:
      - overtime_hours: 18
        overtime_paise: 0
