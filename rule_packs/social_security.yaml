pack: social_security
version: '2026.2'
jurisdiction: IN
description: 'Code on Social Security, 2020 (Act 36 of 2020). This pack divides more sharply than the others, because the
  Code sets out the obligations while the operative figures live in the schemes made under it.

  Coverage and reconciliation rules compare the establishment''s own documents against each other — the employee and wage
  registers against the EPF challan, declared headcounts against each other — so they need no external figure and carry basis:
  RECONCILIATION. They are sound as they stand, and the EPF coverage check is the single highest-value rule in the system.

  The contribution rate (12%, EPF Act s.6 and the 1952 Scheme), the deposit deadline (para 38 of that Scheme), the ESIC wage
  ceiling (₹21,000, ESI (Central) Rules r.50) and the aggregator rate (s.114 gives a 1–2% range, the rate itself is notified)
  are none of them in the Code. Those rules carry basis: RULES_PENDING.

  '
rules:
- id: SS.EPF.WORKERS_NOT_COVERED
  code: SOCIAL_SECURITY
  kind: DISCREPANCY
  severity: HIGH
  weight: 10
  title: Workers in payroll are not present in the uploaded EPF filing
  citation: Code on Social Security, 2020 — First Schedule and Chapter III
  source_ref: storage/the code of social security 2020.md, First Schedule and Chapter III; cross-document reconciliation applies
    only to the uploaded payroll and EPF records
  basis: RECONCILIATION
  requires:
  - wage_register
  - epf
  expression: 'count(difference(pluck(wage_register, ''worker_key''), pluck(epf, ''worker_key''))) == 0

    '
  observe:
    workers_in_wage_register: unique_count(wage_register, 'worker_key')
    workers_in_epf: unique_count(epf, 'worker_key')
    uncovered_workers: count(difference(pluck(wage_register, 'worker_key'), pluck(epf, 'worker_key')))
  expect:
    uncovered_workers: '0'
  message:
    en: One or more workers appear in the wage register but not in the provident fund filing for the same period.
    hi: एक या अधिक श्रमिक मजदूरी रजिस्टर में हैं परन्तु उसी अवधि के भविष्य निधि विवरण में नहीं हैं।
  remediation:
    en: File a revised return covering the omitted workers and deposit the arrears of both employee and employer contributions
      with applicable interest.
    hi: छोड़े गए श्रमिकों को सम्मिलित करते हुए संशोधित विवरणी दाखिल करें और कर्मचारी व नियोजक अंशदान का बकाया लागू ब्याज सहित
      जमा करें।
  fixtures:
  - name: everyone_covered
    should_pass: true
    facts:
      wage_register:
      - worker_key: W1
      - worker_key: W2
      epf:
      - worker_key: W1
      - worker_key: W2
  - name: two_workers_missing_from_epf
    should_pass: false
    facts:
      wage_register:
      - worker_key: W1
      - worker_key: W2
      - worker_key: W3
      epf:
      - worker_key: W1
- id: SS.EPF.WAGE_BASE_UNDERSTATED
  code: SOCIAL_SECURITY
  kind: DISCREPANCY
  severity: HIGH
  weight: 9
  title: EPF wage base is lower than the statutory wages in the wage register
  citation: Code on Social Security, 2020 — s.2(88) read with Chapter III
  source_ref: 'Cross-document reconciliation: wage register basic plus dearness allowance against the EPF wage base. Both
    figures come from the employer''s own documents, so no notification is needed'
  basis: RECONCILIATION
  requires:
  - epf
  for_each: epf
  expression: 'is_missing(row.wage_base_paise) or is_missing(row.register_wages_paise) or row.wage_base_paise >= row.register_wages_paise
    or within_tolerance(row.wage_base_paise, row.register_wages_paise, 100)

    '
  observe:
    workers_with_understated_base: count(epf)
  expect:
    tolerance_paise: '100'
  message:
    en: The provident fund wage base is below the basic and dearness allowance recorded in the wage register.
    hi: भविष्य निधि मजदूरी आधार, मजदूरी रजिस्टर में दर्ज मूल वेतन और महंगाई भत्ते से कम है।
  remediation:
    en: Recompute contributions on the full statutory wage base and deposit the shortfall with interest.
    hi: पूर्ण सांविधिक मजदूरी आधार पर अंशदान की पुनर्गणना करें और कमी ब्याज सहित जमा करें।
  fixtures:
  - name: base_matches_register
    should_pass: true
    facts:
      epf:
      - wage_base_paise: 1500000
        register_wages_paise: 1500000
  - name: base_understated
    should_pass: false
    facts:
      epf:
      - wage_base_paise: 900000
        register_wages_paise: 1500000
- id: SS.HEADCOUNT.RECONCILIATION
  code: SOCIAL_SECURITY
  kind: ANOMALY
  severity: MEDIUM
  weight: 7
  title: Worker totals differ across uploaded records
  citation: Cross-document data reconciliation
  source_ref: Project advisory comparison across the employee register, wage register, EPF, ESIC and annual return; the five-percent
    tolerance is not a statutory safe harbour
  basis: RECONCILIATION
  requires:
  - counts
  expression: 'is_missing(counts.register) or is_missing(counts.epf) or ratio(abs_value(counts.register - counts.epf), counts.register)
    <= 0.05

    '
  observe:
    register_count: counts.register
    epf_count: counts.epf
    esic_count: counts.esic
    annual_return_count: counts.annual_return
    gap: abs_value(counts.register - counts.epf)
  expect:
    maximum_variance_share: '0.05'
  message:
    en: Worker totals differ across the uploaded records and should be reconciled; this advisory comparison is not by itself
      a legal violation.
    hi: कर्मचारी रजिस्टर और भविष्य निधि विवरण के बीच श्रमिकों की संख्या में सारवान अंतर है।
  remediation:
    en: Reconcile the registers and returns for the period and explain or correct the difference.
    hi: अवधि के रजिस्टरों और विवरणियों का मिलान करें और अंतर स्पष्ट करें या सुधारें।
  fixtures:
  - name: counts_agree
    should_pass: true
    facts:
      counts:
        register: 100
        epf: 98
        esic: 95
        annual_return: 100
  - name: nine_workers_unaccounted
    should_pass: false
    facts:
      counts:
        register: 87
        epf: 78
        esic: 74
        annual_return: 80
- id: SS.EPF.WAGE_BASE_RECORDED
  code: SOCIAL_SECURITY
  kind: NON_COMPLIANCE
  severity: MEDIUM
  weight: 4
  title: EPF wage base is blank in an uploaded member row
  citation: Code on Social Security, 2020 — Chapter III and prescribed contribution return
  source_ref: 'storage/the code of social security 2020.md and storage/the code of social security 2020 central rule.md: uploaded
    EPF contribution particulars'
  basis: STATUTE
  requires:
  - epf
  for_each: epf
  expression: not is_missing(row.wage_base_paise)
  observe:
    rows_checked: count(epf)
  expect:
    requirement_met: 'True'
  message:
    en: The uploaded EPF record has a member row with no contribution wage base.
    hi: null
  remediation:
    en: Complete the verified EPF contribution particulars in the applicable return.
    hi: null
  fixtures:
  - name: compliant_record
    should_pass: true
    facts:
      epf:
      - wage_base_paise: 100000
  - name: non_compliant_record
    should_pass: false
    facts:
      epf:
      - wage_base_paise: null
